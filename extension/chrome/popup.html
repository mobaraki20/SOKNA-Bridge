<!doctype html><html><head><meta charset="utf-8"><title>SOKNA Bridge V3.10.9</title><style>
body{font-family:Segoe UI,Arial,sans-serif;width:430px;margin:0;padding:14px;color:#202124;background:#fff}h1{font-size:16px;margin:0 0 10px}h2{font-size:13px;margin:14px 0 7px}#state{padding:8px 10px;border-radius:8px;background:#eee;font-weight:600;margin-bottom:10px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}button{border:1px solid #bbb;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}button.primary{background:#1769e0;color:#fff;border-color:#1769e0}pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:9px;border-radius:8px;max-height:240px;overflow:auto;font-size:11px}small{color:#666}.activity{border:1px solid #ddd;border-radius:10px;overflow:hidden}.activity-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#f7f7f7}.activity-body{max-height:330px;overflow:auto}.item{padding:8px 10px;border-top:1px solid #eee;font-size:11px}.item:first-child{border-top:0}.item strong{font-size:12px}.meta{color:#666;margin-top:3px;word-break:break-word}.state-pill{display:inline-block;border:1px solid #bbb;border-radius:999px;padding:1px 6px;margin-left:5px;font-size:10px}.empty{padding:12px;color:#777;font-size:11px}.section-title{padding:7px 10px;background:#fafafa;border-top:1px solid #ddd;border-bottom:1px solid #eee;font-size:11px;font-weight:700}.error{color:#8a1c1c;padding:10px;font-size:11px}.credential{border:1px solid #ddd;border-radius:10px;padding:10px}.field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}.field label{font-size:11px;font-weight:600}.field input{border:1px solid #bbb;border-radius:7px;padding:7px 8px;font:inherit;font-size:12px}.credential-list{margin-top:8px;border-top:1px solid #eee}.cred-row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:11px}.cred-row:last-child{border-bottom:0}.cred-main{min-width:0}.cred-id{font-weight:700;word-break:break-word}.cred-user{color:#666;word-break:break-word}.note{font-size:10px;color:#666;margin-top:5px}</style></head><body>
<h1>SOKNA Bridge V3.10.9</h1><div id="state">Checking…</div><div class="row"><button class="primary" id="enable">Enable on this tab</button><button id="disable">Disable</button></div><div class="row"><button id="host">Test Native Host</button><button id="agent">Test Windows Agent</button><button id="status">Health</button><button id="details">Details</button><button id="selftest">Run Self Test</button></div><small>No debugger. No page overlay. Same browser session.</small>
<h2>Test Credentials</h2><div class="credential"><div class="field"><label for="credId">Credential ID</label><input id="credId" maxlength="96" autocomplete="off" placeholder="test-admin"></div><div class="field"><label for="credUser">Username</label><input id="credUser" maxlength="512" autocomplete="username" placeholder="qa@example.com"></div><div class="field"><label for="credSecret">Password / Secret</label><input id="credSecret" type="password" maxlength="16384" autocomplete="new-password" placeholder="Stored with Windows DPAPI"></div><div class="row"><button class="primary" id="saveCredential">Save / Replace</button><button id="refreshCredentials">Refresh</button></div><div class="note">Secrets go directly to the local Native Host and are never written to Chat, recipe files, or diagnostics.</div><div id="credentialList" class="credential-list"><div class="empty">Loading credentials…</div></div></div>
<h2>Activity Monitor</h2><div class="activity"><div class="activity-head"><span id="activitySummary">Loading agent activity…</span><button id="refreshActivity">Refresh</button></div><div id="activity" class="activity-body"><div class="empty">Loading…</div></div></div>
<h2>Diagnostics</h2><pre id="out"></pre><script src="popup.js"></script></body></html>
