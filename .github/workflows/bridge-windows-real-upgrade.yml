name: Bridge Real Old-Version Windows Upgrade (isolated)
on:
  pull_request:
    branches:
      - release/r14-final
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inno-270-to-271:
    name: Real installed 2.7.0 to current 2.7.1 Inno upgrade
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Parse upgrade UAT harness and find Inno
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/qa/Test-RealOldVersionUpgrade.ps1'),
            [ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){throw 'UPGRADE_HARNESS_PARSE_FAILED'}
          $candidates=@()
          $found=Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if($found){$candidates+=$found.Source}
          $programFilesX86=${env:ProgramFiles(x86)}
          if($programFilesX86){$candidates+=(Join-Path $programFilesX86 'Inno Setup 6/ISCC.exe')}
          if($env:ProgramFiles){$candidates+=(Join-Path $env:ProgramFiles 'Inno Setup 7/ISCC.exe')}
          $compiler=$candidates|Where-Object{Test-Path -LiteralPath $_ -PathType Leaf}|Select-Object -First 1
          if(-not $compiler){throw 'UPGRADE_INNO_COMPILER_UNAVAILABLE'}
          "BRIDGE_ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Compile pinned genuine older released 2.7.0
        shell: pwsh
        timeout-minutes: 17
        run: |
          $ErrorActionPreference='Stop'
          $sha='2fb7531c2564034a861042514844b689273917f6'
          $oldRepo=Join-Path $env:RUNNER_TEMP 'bridge-270-frozen-source'
          & git worktree add --detach $oldRepo $sha
          if($LASTEXITCODE -ne 0){throw 'LEGACY_GIT_WORKTREE_FAILED'}
          if((git -C $oldRepo rev-parse HEAD).Trim() -ne $sha){throw 'LEGACY_RELEASE_COMMIT_MISMATCH'}
          & (Join-Path $oldRepo 'tools/installer/Build-P1Installer.ps1') -RepoRoot $oldRepo -ExpectedSourceCommit $sha -InnoCompiler $env:BRIDGE_ISCC | Out-Host
          if($LASTEXITCODE -ne 0 -or -not $?){throw 'LEGACY_REAL_INSTALLER_BUILD_FAILED'}
          $setup=Join-Path $oldRepo 'artifacts/windows/setup/SOKNA-Bridge-Setup-2.7.0-x64.exe'
          if(-not(Test-Path -LiteralPath $setup -PathType Leaf)){throw 'LEGACY_SETUP_MISSING'}
          $legacyCopy=Join-Path $env:RUNNER_TEMP 'SOKNA-Bridge-Setup-2.7.0-frozen.exe'
          Copy-Item -LiteralPath $setup -Destination $legacyCopy -Force
          $sha256=(Get-FileHash -LiteralPath $legacyCopy -Algorithm SHA256).Hash.ToLowerInvariant()
          "BRIDGE_OLD_SETUP=$legacyCopy" >> $env:GITHUB_ENV
          Write-Host "LEGACY_270_RELEASE_INSTALLER_BUILT_PASS sha256=$sha256 source_commit=$sha"
      - name: Compile exact-commit current candidate 2.7.1
        shell: pwsh
        timeout-minutes: 18
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          & ./tools/installer/Build-P1Installer.ps1 -ExpectedSourceCommit $sha -InnoCompiler $env:BRIDGE_ISCC | Out-Host
          if($LASTEXITCODE -ne 0 -or -not $?){throw 'CURRENT_INSTALLER_BUILD_FAILED'}
          $setup=Join-Path $PWD 'artifacts/windows/setup/SOKNA-Bridge-Setup-2.7.1-x64.exe'
          if(-not(Test-Path -LiteralPath $setup -PathType Leaf)){throw 'CURRENT_SETUP_MISSING'}
          $sha256=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "CURRENT_271_INSTALLER_BUILT_PASS sha256=$sha256 source_commit=$sha"
      - name: Actually install 2.7.0 then upgrade in place to 2.7.1
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          & ./tools/qa/Test-RealOldVersionUpgrade.ps1 -LegacySetupPath $env:BRIDGE_OLD_SETUP -CandidateSetupPath 'artifacts/windows/setup/SOKNA-Bridge-Setup-2.7.1-x64.exe' -CandidateSourceCommit $sha
          if(-not $?){throw 'REAL_OLD_VERSION_UPGRADE_UAT_FAILED'}
      - name: Save scrubbed, scope-bound evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-real-old-version-inno-upgrade-evidence
          path: ${{ runner.temp }}/SOKNA-Bridge-RealUpgrade-UAT/upgrade-evidence.json
          retention-days: 14
          if-no-files-found: error
      - name: Qualification boundary
        if: success()
        shell: pwsh
        run: |
          Write-Host 'REAL_OLD_VERSION_270_TO_271_WINDOWS_INSTALLER_UPGRADE_PASS'
          Write-Host 'NOT_QUALIFIED: maintenance delta package upgrade, power loss, manual Chrome, broader W11 matrix, release'
