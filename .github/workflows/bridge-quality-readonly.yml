name: Bridge Candidate Read-Only Qualification
on:
  pull_request:
    branches:
      - release/r14-final
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bridge-candidate-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tests:
    name: Source contracts and race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: JavaScript syntax and contracts
        shell: bash
        run: |
          set -euo pipefail
          for f in extension/chrome/*.js; do node --check "$f"; done
          for f in tools/tests/test_*.mjs; do node "$f"; done
      - name: Python contracts
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          for f in tools/tests/test_*.py; do python "$f"; done
      - name: Go tests, race, and vet
        shell: bash
        run: |
          set -euo pipefail
          for mod in native/agent native/host native/browser native/provider; do
            (cd "$mod" && go test ./... && go test -race ./... && go vet ./...)
          done
  windows-powershell-syntax:
    name: Windows PowerShell syntax (not installation UAT)
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem native/runtime,tools/installer,installer/bootstrap -Recurse -Include *.ps1,*.psm1 -File | ForEach-Object {
            $tokens=$null;$errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){ throw "PS_PARSE_FAILURE $($_.FullName): $($errors | Out-String)" }
          }
  windows-source-build:
    name: Windows Go and .NET qualification (not installer UAT)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Go tests on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($m in @('native/host','native/agent','native/browser','native/provider')) {
            Push-Location $m
            try { go test ./...; if($LASTEXITCODE -ne 0) { throw "GO_WINDOWS_TEST_FAILED $m" } }
            finally { Pop-Location }
          }
      - name: Build Windows .NET projects without installation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @(
            'maintenance/Sokna.Agent.Maintenance/Sokna.Agent.Maintenance.csproj',
            'maintenance/Sokna.Agent.Launcher/Sokna.Agent.Launcher.csproj',
            'maintenance/Sokna.Bridge.ControlCenter/Sokna.Bridge.ControlCenter.csproj'
          )) {
            dotnet build $p -c Release --nologo
            if($LASTEXITCODE -ne 0) { throw "DOTNET_WINDOWS_BUILD_FAILED $p" }
          }

      - name: Verify artifact root preservation using actual .NET assembly
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bin=Join-Path $PWD 'maintenance/Sokna.Agent.Maintenance/bin/Release'
          $candidate=Get-ChildItem -LiteralPath $bin -Filter 'Sokna.Agent.Maintenance.dll' -File -Recurse |
            Where-Object { $_.FullName -match 'net8\.0[\\/]win-x64[\\/]' } | Select-Object -First 1
          if($null -eq $candidate){throw 'MAINTENANCE_ASSEMBLY_MISSING'}
          $dll=$candidate.FullName
          $asm=[System.Reflection.Assembly]::LoadFrom($dll)
          $type=$asm.GetType('Sokna.Agent.Maintenance.AgentConfiguration',$true)
          $method=$type.GetMethod('ResolveArtifactRoot',[System.Reflection.BindingFlags]'NonPublic,Static')
          if($null -eq $method){throw 'RESOLVE_ARTIFACT_ROOT_METHOD_MISSING'}
          $root=Join-Path $env:RUNNER_TEMP 'bridge-maintenance-test'
          $data=Join-Path $env:RUNNER_TEMP 'my-other-software-storage'
          New-Item -ItemType Directory -Force -Path $root,$data|Out-Null
          $config=Join-Path $root 'config.json'
          $original='{ "artifact_root": "' + ($data.Replace('\','\\')) + '", "port": 8766 }'
          [IO.File]::WriteAllText($config,$original)
          $result=[string]$method.Invoke($null,([object[]]@([string]$root,[string]::Empty)))
          if($result -ne [IO.Path]::GetFullPath($data)){throw 'ARTIFACT_ROOT_CHANGED_DURING_UPGRADE'}
          $other=Join-Path $env:RUNNER_TEMP 'explicit-storage'
          $explicit=[string]$method.Invoke($null,([object[]]@([string]$root,[string]$other)))
          if($explicit -ne [IO.Path]::GetFullPath($other)){throw 'EXPLICIT_ARTIFACT_ROOT_NOT_HONORED'}
          [IO.File]::WriteAllText($config,'{corrupt')
          $rejected=$false
          try { [void]$method.Invoke($null,([object[]]@([string]$root,[string]::Empty))) }
          catch { $rejected=$true }
          if(-not $rejected){throw 'CORRUPT_EXISTING_CONFIG_SILENTLY_REPLACED'}
          Write-Host 'DOTNET_ARTIFACT_ROOT_CONTRACT_PASS; INSTALLED_UPGRADE_NOT_TESTED'

  windows-bootstrap-smoke:
    name: Windows bootstrap smoke on disposable runner (not upgrade UAT)
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build standalone bootstrap and exercise install/upgrade guards
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & ./installer/bootstrap/build-package.ps1 -OutDir 'artifacts/bridge-ci' | Out-Host
          if($LASTEXITCODE -ne 0){throw 'BOOTSTRAP_BUILD_FAILED'}
          $stage=Join-Path $PWD 'artifacts/bridge-ci/SOKNA-Bridge-Setup'
          $install=Join-Path $stage 'install.ps1'
          if(-not(Test-Path -LiteralPath $install -PathType Leaf)){throw 'BOOTSTRAP_INSTALL_SCRIPT_MISSING'}
          $dataRoot=Join-Path $env:RUNNER_TEMP 'bridge-unrelated-webapp'
          & $install -SkipStart -SkipOpenExtensions -WorkspaceRoot $dataRoot
          $configPath=Join-Path $env:LOCALAPPDATA 'SOKNA-Bridge-V2/config.json'
          $cfg=Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          if($cfg.workspace_root -ne $dataRoot){throw 'FRESH_WORKSPACE_ROOT_MISMATCH'}
          if([string]$cfg.default_github_owner -ne ''){throw 'FRESH_INSTALL_OWNER_NOT_EMPTY'}
          if(@($cfg.allowed_github_owners).Count -ne 0){throw 'FRESH_INSTALL_OWNER_ALLOWLIST_NOT_EMPTY'}
          if(@($cfg.workspaces.PSObject.Properties).Count -ne 0){throw 'FRESH_INSTALL_AUTODISCOVERED_APP'}
          if([string]::IsNullOrWhiteSpace([string]$cfg.token)){throw 'FRESH_INSTALL_TOKEN_MISSING'}
          $token=[string]$cfg.token
          $cfg.allowed_github_owners=@('example')
          $cfg.workspaces | Add-Member -NotePropertyName 'DemoWebApp' -NotePropertyValue ([pscustomobject]@{path=$dataRoot;expected_repo='example/demo-webapp';write_enabled=$false}) -Force
          $cfg | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $configPath -Encoding UTF8
          & $install -SkipStart -SkipOpenExtensions
          $again=Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          if($again.token -ne $token){throw 'UPGRADE_TOKEN_CHANGED'}
          if($again.workspace_root -ne $dataRoot){throw 'UPGRADE_ROOT_RESET'}
          if([string]$again.workspaces.DemoWebApp.expected_repo -ne 'example/demo-webapp'){throw 'UPGRADE_WORKSPACE_REMOVED'}
          if(-not (@($again.allowed_github_owners) -contains 'example')){throw 'UPGRADE_PERMISSION_RESET'}
          $original=Get-Content -LiteralPath $configPath -Raw
          Set-Content -LiteralPath $configPath -Value '{broken-json' -Encoding UTF8
          $rejected=$false
          try { & $install -SkipStart -SkipOpenExtensions } catch { $rejected=($_.Exception.Message -like '*BRIDGE_CONFIG_INVALID_REFUSING_OVERWRITE*') }
          if(-not $rejected){throw 'INVALID_CONFIG_WAS_NOT_REJECTED'}
          if((Get-Content -LiteralPath $configPath -Raw).Trim() -ne '{broken-json'){throw 'INVALID_CONFIG_SILENTLY_REPLACED'}
          Set-Content -LiteralPath $configPath -Value $original -Encoding UTF8
          Write-Host 'BRIDGE_BOOTSTRAP_SMOKE_PASS; INSTALLED_UPGRADE_ROLLBACK_UAT_NOT_RUN'

  windows-installer-payload:
    name: Windows Installer payload build and manifest (no setup, no install)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build signed-off source payload without Inno or install
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sourceCommit=(git rev-parse HEAD).Trim()
          & ./tools/installer/Build-P1Installer.ps1 -SkipInno -ExpectedSourceCommit $sourceCommit | Out-Host
          $manifestPath='artifacts/windows/installer-payload/manifests/installed-manifest.json'
          if(-not(Test-Path -LiteralPath $manifestPath -PathType Leaf)){throw 'INSTALLER_PAYLOAD_MANIFEST_MISSING'}
          $manifest=Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if($manifest.source_commit -ne $sourceCommit){throw 'INSTALLER_PAYLOAD_SOURCE_MISMATCH'}
          if(@($manifest.files).Count -lt 10){throw 'INSTALLER_PAYLOAD_INCOMPLETE'}
          foreach($exe in @('Sokna.Agent.Maintenance.exe','Sokna.Agent.Launcher.exe','Sokna.Bridge.ControlCenter.exe')){
            if(-not(Test-Path -LiteralPath (Join-Path 'artifacts/windows/installer-payload' $exe) -PathType Leaf)){throw "INSTALLER_PAYLOAD_EXE_MISSING: $exe"}
          }
          if((git status --porcelain --untracked-files=all).Count -gt 0){throw 'BUILD_MODIFIED_TRACKED_OR_UNTRACKED_SOURCE'}
          Write-Host 'WINDOWS_INSTALLER_PAYLOAD_BUILD_PASS; INNO_INSTALLER_AND_WINDOWS_INSTALLED_UAT_NOT_RUN'

  windows-inno-build:
    name: Inno Setup candidate compilation (no installation or release)
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Locate Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $paths=@()
          $compiler=Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if($compiler){$paths+= $compiler.Source}
          $x86=${env:ProgramFiles(x86)}
          if($x86){$paths+=(Join-Path $x86 'Inno Setup 6/ISCC.exe')}
          if($env:ProgramFiles){$paths+=(Join-Path $env:ProgramFiles 'Inno Setup 7/ISCC.exe')}
          $found=$paths|Where-Object{Test-Path -LiteralPath $_ -PathType Leaf}|Select-Object -First 1
          if(-not $found){throw 'WINDOWS_RUNNER_INNO_SETUP_MISSING; do not claim installer qualified'}
          "BRIDGE_ISCC=$found" >> $env:GITHUB_ENV
          Write-Host "INNO_SETUP_COMPILER_FOUND"
      - name: Build actual Windows setup from unchanged commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          & ./tools/installer/Build-P1Installer.ps1 -ExpectedSourceCommit $sha -InnoCompiler $env:BRIDGE_ISCC | Out-Host
          if($LASTEXITCODE -ne 0){throw 'INNO_SETUP_BUILD_FAILED'}
          $setup=Join-Path $PWD 'artifacts/windows/setup/SOKNA-Bridge-Setup-2.7.1-x64.exe'
          if(-not(Test-Path -LiteralPath $setup -PathType Leaf)){throw 'INNO_SETUP_FILE_MISSING'}
          $meta=Get-Item -LiteralPath $setup
          if($meta.Length -lt 100000){throw 'INNO_SETUP_TOO_SMALL'}
          $digest=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if((git status --porcelain --untracked-files=all).Count -gt 0){throw 'INNO_BUILD_MUTATED_SOURCE'}
          Write-Host "INNO_COMPILE_PASS bytes=$($meta.Length) sha256=$digest commit=$sha"
          Write-Host 'INSTALLER_NOT_EXECUTED; NO INSTALL/UPGRADE/REPAIR/ROLLBACK UAT PERFORMED'

      - name: Install, reinstall, verify ownership, and uninstall on disposable Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=Join-Path $PWD 'artifacts/windows/setup/SOKNA-Bridge-Setup-2.7.1-x64.exe'
          $testRoot=Join-Path $env:RUNNER_TEMP 'bridge-standalone-installer-e2e'
          $install=Join-Path $testRoot 'Installed Bridge App'
          $data=Join-Path $testRoot 'Unrelated Software Artifacts'
          $logs=Join-Path $testRoot 'test-logs'
          New-Item -ItemType Directory -Force -Path $testRoot,$logs,$data|Out-Null
          function Invoke-Setup([string]$exe,[string[]]$args,[string]$what) {
            $psi=[Diagnostics.ProcessStartInfo]::new()
            $psi.FileName=$exe
            $psi.UseShellExecute=$false
            $psi.CreateNoWindow=$true
            foreach($arg in $args){[void]$psi.ArgumentList.Add($arg)}
            $process=[Diagnostics.Process]::Start($psi)
            if($null -eq $process){throw "INSTALLER_PROCESS_NOT_STARTED: $what"}
            try {
              if(-not $process.WaitForExit(180000)) {
                $process.Kill($true)
                throw "INSTALLER_PROCESS_TIMEOUT: $what"
              }
              if($process.ExitCode -ne 0){throw "INSTALLER_EXIT_NONZERO: $what exit=$($process.ExitCode)"}
            } catch {
              Write-Host "INSTALLER_DIAGNOSTIC_FAILED_STAGE: $what"
              foreach($folder in @($logs,(Join-Path $install 'logs'))) {
                if(Test-Path -LiteralPath $folder -PathType Container){
                  Get-ChildItem -LiteralPath $folder -Recurse -File -Filter '*.log' |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 6 | ForEach-Object {
                      Write-Host "DIAGNOSTIC_FILE: $($_.Name)"
                      Get-Content -LiteralPath $_.FullName -Tail 45 -ErrorAction SilentlyContinue |
                        Where-Object { $_ -match 'install|error|exit|launch|initialize|health|runtime|start|process|copy|extract|failed|action|prepare' } |
                        ForEach-Object {
                          $line=[regex]::Replace($_,'(?i)(X-Sokna-Token|token)[^\\r\\n]{0,8}[=:][^\\s,;]{8,}', '$1=[REDACTED]')
                          Write-Host "INSTALL_DIAGNOSTIC: $line"
                        }
                    }
                }
              }
              throw
            } finally { $process.Dispose() }
          }
          function Args-For([string]$log,[bool]$withArtifactRoot) {
            $args=@('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/NOICONS',
              ('/DIR="'+$install+'"'),('/LOG="'+$log+'"'))
            if($withArtifactRoot){$args+=('/ArtifactRoot="'+$data+'"')}
            return ,$args
          }
          $firstLog=Join-Path $logs 'install-first.log'
          Invoke-Setup $setup (Args-For $firstLog $true) 'fresh-install'
          $config=Join-Path $install 'config.json'
          if(-not(Test-Path -LiteralPath $config -PathType Leaf)){throw 'INSTALLER_NO_CONFIG'}
          $first=Get-Content -LiteralPath $config -Raw|ConvertFrom-Json
          if([IO.Path]::GetFullPath([string]$first.artifact_root) -ne [IO.Path]::GetFullPath($data)){throw 'INSTALLER_ARTIFACT_ROOT_WRONG'}
          $token=[string]$first.token
          if([string]::IsNullOrWhiteSpace($token)){throw 'INSTALLER_TOKEN_MISSING'}
          $manifest=Join-Path $install 'manifests/installed-manifest.json'
          if(-not(Test-Path -LiteralPath $manifest -PathType Leaf)){throw 'INSTALLER_INSTALLED_MANIFEST_MISSING'}
          $nativeHost=Join-Path $install 'native-host/com.sokna.bridge.v3.json'
          if(-not(Test-Path -LiteralPath $nativeHost -PathType Leaf)){throw 'INSTALLER_NATIVE_HOST_MANIFEST_MISSING'}
          $host=(Get-Content -LiteralPath $nativeHost -Raw|ConvertFrom-Json)
          if(-not(Test-Path -LiteralPath $host.path -PathType Leaf)){throw 'INSTALLER_NATIVE_HOST_PATH_BROKEN'}
          $marker=Join-Path $data 'operator-data-must-survive-uninstall.txt'
          [IO.File]::WriteAllText($marker,'DO_NOT_DELETE')
          $secondLog=Join-Path $logs 'install-repeat.log'
          Invoke-Setup $setup (Args-For $secondLog $false) 'reinstall-without-artifact-override'
          $after=Get-Content -LiteralPath $config -Raw|ConvertFrom-Json
          if([string]$after.token -ne $token){throw 'REINSTALL_ROTATED_TOKEN_UNEXPECTEDLY'}
          if([IO.Path]::GetFullPath([string]$after.artifact_root) -ne [IO.Path]::GetFullPath($data)){throw 'REINSTALL_OVERWROTE_CUSTOM_ARTIFACT_ROOT'}
          if(-not(Test-Path -LiteralPath $marker -PathType Leaf)){throw 'REINSTALL_DESTROYED_OPERATOR_DATA'}
          $uninstaller=Join-Path $install 'unins000.exe'
          if(-not(Test-Path -LiteralPath $uninstaller -PathType Leaf)){throw 'INSTALLER_UNINSTALLER_MISSING'}
          Invoke-Setup $uninstaller @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',
            ('/LOG="'+(Join-Path $logs 'uninstall.log')+'"')) 'uninstall'
          if(-not(Test-Path -LiteralPath $marker -PathType Leaf)){throw 'UNINSTALL_REMOVED_UNOWNED_DATA'}
          Write-Host 'WINDOWS_INSTALL_REINSTALL_UNINSTALL_E2E_PASS'
          Write-Host 'STILL_NOT_TESTED: upgraded live legacy installs, repair, rollback, Chrome/Edge extension clicks'
