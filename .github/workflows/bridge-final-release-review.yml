name: Bridge Final Release Review Kit (no publish)
on:
  pull_request:
    branches:
      - release/r14-final
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-review-bundle:
    name: Frozen unsigned installer review, Chrome extension hashes and signing facts
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Source-based candidate gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/qa/Build-ReleaseReviewBundle.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){throw 'RELEASE_REVIEW_POWERSHELL_PARSE_FAILED'}
          $s=Get-Content -LiteralPath 'tools/qa/Build-ReleaseReviewBundle.ps1' -Raw
          if($s -match '\$host\b'){throw 'RELEASE_REVIEW_RESERVED_PS_VARIABLE'}
          python tools/tests/test_bridge_p0_security_releases.py
          if($LASTEXITCODE -ne 0){throw 'RELEASE_REVIEW_SECURITY_CORE_FAILED'}
          Write-Host 'RELEASE_REVIEW_SOURCE_GATES_PASS'
      - name: Build exact checkout Windows Inno installer
        shell: pwsh
        timeout-minutes: 18
        run: |
          $ErrorActionPreference='Stop'
          $paths=@()
          $command=Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if($command){$paths+=$command.Source}
          $x86=[Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          if($x86){$paths+=(Join-Path $x86 'Inno Setup 6/ISCC.exe')}
          if($env:ProgramFiles){$paths+=(Join-Path $env:ProgramFiles 'Inno Setup 7/ISCC.exe')}
          $compiler=$paths|Where-Object{Test-Path -LiteralPath $_ -PathType Leaf}|Select-Object -First 1
          if(-not $compiler){throw 'RELEASE_REVIEW_INNO_COMPILER_NOT_FOUND'}
          $commit=(git rev-parse HEAD).Trim()
          & ./tools/installer/Build-P1Installer.ps1 -ExpectedSourceCommit $commit -InnoCompiler $compiler|Out-Host
          if($LASTEXITCODE -ne 0 -or -not $?){throw 'RELEASE_REVIEW_EXACT_INSTALLER_BUILD_FAILED'}
          Write-Host "RELEASE_REVIEW_INSTALLER_EXACT_SOURCE_PASS source=$commit"
      - name: Validate hashes, extension identity, Authenticode and prepare candidate
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          $output=Join-Path $env:RUNNER_TEMP 'SOKNA-Bridge-Release-Review'
          & ./tools/qa/Build-ReleaseReviewBundle.ps1 -RepoRoot $PWD -OutputDirectory $output
          if(-not $?){throw 'RELEASE_REVIEW_VERIFY_AND_PACKAGE_FAILED'}
          $meta=Get-Content -LiteralPath (Join-Path $output 'REVIEW_PROVENANCE.json') -Raw|ConvertFrom-Json
          if([bool]$meta.release_ready -ne $false -or $meta.owner_final_release_approval -ne 'NOT_GRANTED'){throw 'RELEASE_REVIEW_INCORRECT_RELEASE_CLAIM'}
          if(-not(Test-Path -LiteralPath (Join-Path $output 'SHA256SUMS.txt'))){throw 'RELEASE_REVIEW_SHA256_FILE_MISSING'}
          Write-Host 'RELEASE_REVIEW_BUNDLE_VERIFIED_NOT_RELEASE_PASS'
      - name: Upload isolated review candidate only after verified build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-final-release-review-candidate-not-signed
          path: ${{ runner.temp }}/SOKNA-Bridge-Release-Review/
          retention-days: 7
          if-no-files-found: error
      - name: No publication and facts-only qualification
        if: success()
        shell: pwsh
        run: |
          Write-Host 'RELEASE_REVIEW_ARTIFACT_PREPARED_PASS'
          Write-Host 'NOT_RELEASED: No signing credential, no publication, no tag, no merge, no deployment'
          Write-Host 'NOT_QUALIFIED: Chrome manual UI persistent install, independent privacy assessment'
