name: Native Agent CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Agent unit tests
        working-directory: native/agent
        run: go test ./...
      - name: Agent build
        working-directory: native/agent
        run: go build .
      - name: Native Host unit tests
        working-directory: native/host
        run: go test ./...
      - name: Native Host build
        working-directory: native/host
        run: go build .
      - name: Browser helper unit tests
        working-directory: native/browser
        run: go test ./...
      - name: Browser helper build
        working-directory: native/browser
        run: go build .
      - name: Provider unit tests
        working-directory: native/provider
        run: go test ./...
      - name: Provider build
        working-directory: native/provider
        run: go build .
