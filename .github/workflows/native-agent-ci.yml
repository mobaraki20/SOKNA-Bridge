name: Native Agent CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test ./...
      - run: go build .
