name: Bridge Chrome Installed Native UAT (disposable Windows)
on:
  pull_request:
    branches:
      - release/r14-final
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome-installed-native:
    name: Actual Chrome for Testing with installed extension and Native Host
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Windows Chrome qualification harness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/qa/Invoke-ChromeNativeInstalledUAT.ps1'),
            [ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){throw 'CHROME_QA_PS_PARSE_ERROR'}
          node --check ./tools/qa/chrome_native_installed_uat.mjs
          if($LASTEXITCODE -ne 0){throw 'CHROME_QA_JS_PARSE_ERROR'}
      - name: Build exact commit Windows installer (no release)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@()
          $path=Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if($path){$candidates+=$path.Source}
          $x86=${env:ProgramFiles(x86)}
          if($x86){$candidates+=(Join-Path $x86 'Inno Setup 6/ISCC.exe')}
          if($env:ProgramFiles){$candidates+=(Join-Path $env:ProgramFiles 'Inno Setup 7/ISCC.exe')}
          $compiler=$candidates|Where-Object{Test-Path -LiteralPath $_ -PathType Leaf}|Select-Object -First 1
          if(-not $compiler){throw 'CHROME_UAT_INNO_SETUP_NOT_INSTALLED'}
          $sha=(git rev-parse HEAD).Trim()
          & ./tools/installer/Build-P1Installer.ps1 -ExpectedSourceCommit $sha -InnoCompiler $compiler | Out-Host
          if($LASTEXITCODE -ne 0){throw 'CHROME_UAT_BUILD_FAILED'}
          $setup='artifacts/windows/setup/SOKNA-Bridge-Setup-2.7.1-x64.exe'
          if(-not(Test-Path -LiteralPath $setup -PathType Leaf)){throw 'CHROME_UAT_INSTALLER_MISSING'}
          $hash=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "CHROME_UAT_IMMUTABLE_INSTALLER_BUILD_PASS sha256=$hash commit=$sha"
      - name: Installed Inno extension to real Chrome Native Messaging round-trip
        shell: pwsh
        timeout-minutes: 17
        run: |
          $ErrorActionPreference='Stop'
          & ./tools/qa/Invoke-ChromeNativeInstalledUAT.ps1 -SetupPath 'artifacts/windows/setup/SOKNA-Bridge-Setup-2.7.1-x64.exe'
          if(-not $?){throw 'CHROME_UAT_FAILED'}
      - name: Retain scrubbed UAT evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-chrome-native-installed-evidence
          path: ${{ runner.temp }}/SOKNA-Bridge-Chrome-Installed-UAT/chrome-native-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Build Win10 manual Chrome candidate after successful Chrome for Testing
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'SOKNA-Bridge-Win10-Operator-Candidate'
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          $sha=(git rev-parse HEAD).Trim()
          $exe=Join-Path $PWD 'artifacts/windows/setup/SOKNA-Bridge-Setup-2.7.1-x64.exe'
          $mf=Join-Path $PWD 'artifacts/windows/installer-payload/manifests/installed-manifest.json'
          $ev=Join-Path $env:RUNNER_TEMP 'SOKNA-Bridge-Chrome-Installed-UAT/chrome-native-evidence.json'
          foreach($file in @($exe,$mf,$ev)){
            if(-not(Test-Path -LiteralPath $file -PathType Leaf)){throw 'WIN10_CANDIDATE_INPUT_MISSING'}
          }
          $manifest=Get-Content -LiteralPath $mf -Raw -Encoding UTF8|ConvertFrom-Json
          $evidence=Get-Content -LiteralPath $ev -Raw -Encoding UTF8|ConvertFrom-Json
          if([string]$manifest.source_commit -ne $sha -or [string]$manifest.product_version -ne '2.7.1'){throw 'WIN10_CANDIDATE_SOURCE_MISMATCH'}
          if([string]$evidence.status -ne 'PASS' -or [string]$evidence.kind -ne 'DISPOSABLE_WINDOWS_CHROME_FOR_TESTING_INSTALLED_HOST'){throw 'WIN10_CHROME_CFT_EVIDENCE_NOT_PASS'}
          $hash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Copy-Item -LiteralPath $exe -Destination $out
          Copy-Item -LiteralPath 'tools/qa/Invoke-Win10ChromeOperatorCheck.ps1' -Destination $out
          Copy-Item -LiteralPath 'docs/qa/WIN10_CHROME_OPERATOR_UAT_FA.md' -Destination $out
          $meta=[ordered]@{
            schema='sokna-bridge-win10-chrome-operator-candidate-v1'
            release_status='DRAFT_TEST_ONLY'
            target='Windows 10 x64 + Google Chrome Stable manual UAT'
            source_commit=$sha
            installer_sha256=$hash
            installer_bytes=(Get-Item -LiteralPath $exe).Length
            windows_10_client_ci='NOT_RUN'
            chrome_for_testing_windows_server_ci='PASS'
            manual_chrome_stable='NOT_RUN'
            release_ready=$false
          }
          [IO.File]::WriteAllText((Join-Path $out 'candidate-provenance.json'),($meta|ConvertTo-Json -Depth 5),[Text.UTF8Encoding]::new($false))
          Write-Host "WIN10_TEST_CANDIDATE_PROVENANCE_PASS sha256=$hash source=$sha"
      - name: Upload Win10 operator candidate as temporary workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-win10-chrome-operator-candidate
          path: ${{ runner.temp }}/SOKNA-Bridge-Win10-Operator-Candidate/
          retention-days: 7
          if-no-files-found: error
      - name: Evidence limits
        if: success()
        shell: pwsh
        run: |
          Write-Host 'CHROME_CFT_INSTALLED_EXTENSION_NATIVE_TRANSPORT_PASS'
          Write-Host 'NOT_QUALIFIED: manual Chrome UI, old-version upgrade, crash recovery, privacy audit, 75-scenario W11, release'
