name: One-time vendor pinned Vazirmatn fonts (read-only Cafe source)
on:
  push:
    branches:
      - work/bridge-control-center-ui-20261019
    paths:
      - .github/workflows/bridge-ui-font-vendor.yml
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy pinned SIL OFL fonts into independent Bridge repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p maintenance/Sokna.Bridge.ControlCenter/fonts
          base="https://raw.githubusercontent.com/mobaraki20/SoknaCafeV3/ba5ec72e4c57bbc65259a903656756b23d6e784a/windows/print-agent/source/assets/fonts"
          folder="maintenance/Sokna.Bridge.ControlCenter/fonts"
          curl --fail --location --retry 3 --silent --show-error "$base/Vazirmatn-Regular.ttf" -o "$folder/Vazirmatn-Regular.ttf"
          curl --fail --location --retry 3 --silent --show-error "$base/Vazirmatn-Bold.ttf" -o "$folder/Vazirmatn-Bold.ttf"
          [[ "$(git hash-object "$folder/Vazirmatn-Regular.ttf")" == "64e4a8189557a17b63fd7a77794207483e592972" ]] || { echo 'Font Regular source differs'; exit 1; }
          [[ "$(git hash-object "$folder/Vazirmatn-Bold.ttf")" == "efa9b095da01d299310bdcae293e24e657fe6da9" ]] || { echo 'Font Bold source differs'; exit 1; }
          test -s "$folder/OFL.txt"
          grep -q 'SIL OPEN FONT LICENSE Version 1.1' "$folder/OFL.txt"
          echo "PINNED_PERSIAN_FONT_BYTES_LICENSE_VERIFIED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$folder/Vazirmatn-Regular.ttf" "$folder/Vazirmatn-Bold.ttf"
          if ! git diff --cached --quiet; then
            git commit -m "assets(ui): vendor pinned Vazirmatn fonts with SIL OFL license"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
