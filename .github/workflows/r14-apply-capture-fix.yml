name: R14 Apply Capture Fix

on:
  push:
    branches:
      - release/r14-final

permissions:
  contents: write

concurrency:
  group: r14-source-correction
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic correction
        run: |
          set -euo pipefail
          node tools/release/Apply-R14-Capture-Fix.mjs
          node --check extension/chrome/browser_capture_map.js
          node --check extension/chrome/action_contracts_core.js
          node tools/tests/test_r14_final_hardening.mjs
          if grep -RInE "manifest\[['\"]version['\"]\][[:space:]]*==[[:space:]]*['\"]3\.14\.0['\"]" tools/tests --include='test_*.py'; then
            echo 'R14_STALE_EXTENSION_TEST_REFERENCE'
            exit 1
          fi
      - name: Commit correction if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- extension/chrome/browser_capture_map.js extension/chrome/action_contracts_core.js tools/tests; then
            echo 'R14_SOURCE_ALREADY_FINAL'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/chrome/browser_capture_map.js extension/chrome/action_contracts_core.js tools/tests
          git commit -m 'fix(r14): finalize capture and current extension contracts [skip ci]'
          git push origin HEAD:release/r14-final
