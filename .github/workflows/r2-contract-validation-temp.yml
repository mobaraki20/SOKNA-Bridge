name: R2 Contract Reliability Temporary
on:
  push:
    branches: [r2/contract-reliability]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check extension/chrome/protocol.js
          node --check extension/chrome/capability_gate.js
          node --check extension/chrome/semantic_gate.js
          node --check extension/chrome/semantic_core.js
          node --check extension/chrome/semantic_intent.js
          node --check extension/chrome/dom_core.js
          node --check extension/chrome/content.js
          node --check extension/chrome/background_bootstrap.js
          node --check extension/chrome/background.js
          node --check extension/chrome/popup.js
      - name: Unified transport regression
        run: node tools/tests/test_transport_v3105.mjs
      - name: Capability preflight regression
        run: node tools/tests/test_capability_gate.mjs
      - name: R2 acceptance tests
        run: |
          python -m py_compile tools/sokna_command_compiler.py tools/tests/test_r2_contract_reliability.py tools/tests/test_r2_observability.py tools/tests/test_r2_outbound_artifacts.py tools/tests/test_r2_browser_audit.py
          python tools/tests/test_r2_contract_reliability.py
          python tools/tests/test_r2_observability.py
          python tools/tests/test_r2_outbound_artifacts.py
          python tools/tests/test_r2_browser_audit.py
      - name: Native Host R2 unit tests
        working-directory: native/host
        run: go test ./...
      - name: Compiler smoke
        run: |
          python tools/sokna_command_compiler.py --meta --json '{"intent":"exec","action":"ping","params":{}}'
