name: R2 Contract Reliability Temporary
on:
  push:
    branches: [r2/contract-reliability]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check extension/chrome/protocol.js
          node --check extension/chrome/content.js
          node --check extension/chrome/background.js
      - name: Existing transport regression
        run: node tools/tests/test_transport_v3105.mjs
      - name: R2 contract reliability tests
        run: |
          python -m py_compile tools/sokna_carrier_guard.py tools/sokna_command_compiler.py tools/tests/test_r2_contract_reliability.py
          python tools/tests/test_r2_contract_reliability.py
      - name: Compiler smoke
        run: |
          python tools/sokna_command_compiler.py --extension-version 3.10.9 --meta --json '{"intent":"exec","action":"ping","params":{}}'
