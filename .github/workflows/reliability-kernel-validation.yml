name: Reliability Kernel Validation
on:
  push:
    branches: [refactor/reliability-kernel-r9, refactor/reliability-kernel-r10, refactor/r11-bulk-delivery]
  pull_request:
    branches: [release/2.7.1]
permissions:
  contents: read
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          for f in extension/chrome/*.js; do node --check "$f"; done
          for f in tools/tests/*.mjs; do node --check "$f"; done
      - name: Reliability regression suite
        run: |
          set -euo pipefail
          for f in tools/tests/*.mjs; do
            echo "=== $f ==="
            node "$f"
          done
      - name: Reliability stress and fault injection
        run: node tools/tests/test_reliability_stress.mjs
      - name: All Python source and product contracts
        run: |
          set -euo pipefail
          for f in tools/tests/test_*.py; do
            echo "=== $f ==="
            python "$f"
          done
