name: R11 Attachment Hotfix Validation

on:
  push:
    branches:
      - hotfix/r11-attachment-acceptance

permissions:
  contents: read

concurrency:
  group: sokna-r11-attachment-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact r11.1 attachment hotfix
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      SOKNA_CANDIDATE_REF: sokna-agent-2.7.1-r11.1-attachment-hotfix
      SOKNA_AGENT_VERSION: 2.7.1
      SOKNA_EXTENSION_VERSION: 3.14.0
      SOKNA_SEMANTIC_VERSION: 2.1.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extension syntax and JavaScript contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem extension/chrome -Filter '*.js' -File | ForEach-Object {
            node --check $_.FullName
            if($LASTEXITCODE-ne0){throw "JS_SYNTAX_FAILED: $($_.Name)"}
          }
          Get-ChildItem tools/tests -Filter 'test_*.mjs' -File | Sort-Object Name | ForEach-Object {
            node $_.FullName
            if($LASTEXITCODE-ne0){throw "JS_CONTRACT_FAILED: $($_.Name)"}
          }

      - name: Python contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem tools/tests -Filter 'test_*.py' -File | Sort-Object Name | ForEach-Object {
            python $_.FullName
            if($LASTEXITCODE-ne0){throw "PY_CONTRACT_FAILED: $($_.Name)"}
          }

      - name: Go unit and integration tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($dir in @('native/agent','native/host','native/browser','native/provider')){
            Push-Location $dir
            try {
              go test ./...
              if($LASTEXITCODE-ne0){throw "GO_TEST_FAILED: $dir"}
            } finally { Pop-Location }
          }

      - name: PowerShell runtime acceptance
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($test in @('./tools/runtime/releases/2.7.1/Test-ArtifactRoot271.ps1','./tools/runtime/releases/2.7.1/Test-Workspace271.ps1','./tools/runtime/releases/2.7.1/Test-AdvancedWorkspace271.ps1','./tools/runtime/releases/2.7.1/Test-ArtifactProviders271.ps1','./tools/runtime/releases/2.7.1/Test-BrowserQA271.ps1','./tools/runtime/releases/2.7.1/Test-ComponentAutomation271.ps1')){
            & $test
            if($LASTEXITCODE-ne0){throw "POWERSHELL_ACCEPTANCE_FAILED: $test"}
          }

      - name: Build exact hotfix source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'sokna-r11-attachment-hotfix'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          python tools/release/Build-R1SourceRC.py --commit $env:GITHUB_SHA --candidate-ref $env:SOKNA_CANDIDATE_REF --agent-version $env:SOKNA_AGENT_VERSION --extension-version $env:SOKNA_EXTENSION_VERSION --accepted-live-agent-baseline 2.7.1 --output (Join-Path $dir 'SOKNA-Agent-2.7.1-r11.1-attachment-hotfix-source.zip') --manifest-output (Join-Path $dir 'source-manifest.json')
          if($LASTEXITCODE-ne0){throw 'HOTFIX_SOURCE_BUILD_FAILED'}
          "SOKNA_HOTFIX_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Acquire pinned Inno Setup compiler
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path .ci/tools -Force | Out-Null
          nuget install Tools.InnoSetup -Version 6.7.3 -OutputDirectory .ci/tools -NonInteractive
          $iscc=Get-ChildItem .ci/tools -Filter ISCC.exe -File -Recurse | Select-Object -First 1
          if(-not $iscc){throw 'PINNED_INNO_COMPILER_NOT_FOUND'}
          $iscc.FullName | Set-Content .ci/inno-compiler-path.txt -Encoding ASCII

      - name: Build exact installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $iscc=(Get-Content .ci/inno-compiler-path.txt -Raw).Trim()
          $output=@(./tools/installer/Build-P1Installer.ps1 -InnoCompiler $iscc -ExpectedSourceCommit $env:GITHUB_SHA)
          $result=($output|Select-Object -Last 1)|ConvertFrom-Json
          if(-not$result.ok){throw 'HOTFIX_INSTALLER_BUILD_FAILED'}
          $setup=Get-ChildItem artifacts/windows/setup -Filter 'SOKNA-Bridge-Setup-*.exe' -File | Select-Object -First 1
          if(-not$setup){throw 'HOTFIX_SETUP_MISSING'}
          $final=Join-Path $setup.DirectoryName 'SOKNA-Bridge-Setup-2.7.1-r11.1-attachment-hotfix-x64.exe'
          Copy-Item $setup.FullName $final -Force
          $manifest=Get-Content 'artifacts/windows/installer-payload/extension/manifest.json' -Raw|ConvertFrom-Json
          if([string]$manifest.version-ne$env:SOKNA_EXTENSION_VERSION){throw "HOTFIX_EXTENSION_VERSION_MISMATCH: $($manifest.version)"}

      - name: Windows lifecycle acceptance
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $setup=Get-ChildItem artifacts/windows/setup -Filter 'SOKNA-Bridge-Setup-2.7.1-r11.1-attachment-hotfix-x64.exe' -File | Select-Object -First 1
          if(-not$setup){throw 'HOTFIX_SETUP_MISSING_FOR_ACCEPTANCE'}
          ./tools/installer/Test-P1Windows.ps1 -SetupPath $setup.FullName
          if($LASTEXITCODE-ne0){throw 'HOTFIX_WINDOWS_ACCEPTANCE_FAILED'}

      - name: Write hotfix evidence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $setup=Get-ChildItem artifacts/windows/setup -Filter 'SOKNA-Bridge-Setup-2.7.1-r11.1-attachment-hotfix-x64.exe' -File | Select-Object -First 1
          $hash=(Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{schema='sokna-r11-attachment-hotfix-validation-v1';ok=$true;candidate_ref=$env:SOKNA_CANDIDATE_REF;source_commit=$env:GITHUB_SHA;agent_version=$env:SOKNA_AGENT_VERSION;extension_version=$env:SOKNA_EXTENSION_VERSION;semantic_version=$env:SOKNA_SEMANTIC_VERSION;setup_name=$setup.Name;setup_sha256=$hash;manual_attachment_uat_required=$true}|ConvertTo-Json -Depth 5|Set-Content (Join-Path $env:SOKNA_HOTFIX_DIR 'r11-attachment-hotfix-validation.json') -Encoding UTF8

      - name: Upload r11.1 attachment hotfix
        uses: actions/upload-artifact@v4
        with:
          name: SOKNA-Bridge-2.7.1-r11.1-attachment-hotfix-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}\sokna-r11-attachment-hotfix\SOKNA-Agent-2.7.1-r11.1-attachment-hotfix-source.zip
            ${{ runner.temp }}\sokna-r11-attachment-hotfix\source-manifest.json
            ${{ runner.temp }}\sokna-r11-attachment-hotfix\r11-attachment-hotfix-validation.json
            artifacts/windows/setup/SOKNA-Bridge-Setup-2.7.1-r11.1-attachment-hotfix-x64.exe
            artifacts/windows/installer-payload/manifests/installed-manifest.json
