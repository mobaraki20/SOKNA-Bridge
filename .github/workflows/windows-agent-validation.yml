name: Windows Agent Validation
run-name: >-
  Windows Agent Validation (${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.ref == 'refs/heads/release/2.7.1' && 'full' || 'quick') }})
  [${{ github.event_name == 'workflow_dispatch' && inputs.request_id || 'push' }}]
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile
        required: true
        default: full
        type: choice
        options: [quick, full]
      request_id:
        description: Correlation id for durable Agent collection
        required: true
        type: string
      expected_commit:
        description: Exact R1 source commit required for full RC validation
        required: false
        default: ''
        type: string
  pull_request:
    branches: [release/2.7.1]
    paths:
      - 'native/runtime/**'
      - 'native/host/**'
      - 'native/browser/**'
      - 'native/provider/**'
      - 'native/agent/**'
      - 'maintenance/**'
      - 'installer/windows/**'
      - 'tools/installer/**'
      - 'tools/release/**'
      - 'extension/chrome/**'
      - 'tools/ci/**'
      - 'tools/knowledge/**'
      - 'tools/tests/**'
      - 'docs/contracts/**'
      - 'docs/browser/**'
      - 'docs/knowledge/**'
      - 'docs/releases/**'
      - '.github/workflows/windows-agent-validation.yml'
  push:
    branches: [dev/bootstrap-v2.5, release/2.7.1]
    paths:
      - 'native/runtime/**'
      - 'native/host/**'
      - 'native/browser/**'
      - 'native/provider/**'
      - 'native/agent/**'
      - 'maintenance/**'
      - 'installer/windows/**'
      - 'tools/installer/**'
      - 'tools/release/**'
      - 'extension/chrome/**'
      - 'tools/ci/**'
      - 'tools/knowledge/**'
      - 'tools/tests/**'
      - 'docs/contracts/**'
      - 'docs/browser/**'
      - 'docs/knowledge/**'
      - 'docs/releases/**'
      - '.github/workflows/windows-agent-validation.yml'
permissions:
  contents: read
concurrency:
  group: windows-agent-validation-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.ref == 'refs/heads/release/2.7.1' && 'full' || 'quick') }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-2025
    env:
      SOKNA_VALIDATION_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.ref == 'refs/heads/release/2.7.1' && 'full' || 'quick') }}
      SOKNA_EXPECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit || github.sha }}
      SOKNA_CANDIDATE_REF: ${{ github.ref == 'refs/heads/release/2.7.1' && 'sokna-agent-2.7.1-r2' || 'sokna-agent-2.6.0-rc9' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact R1 source commit guard and deterministic source bundle
        if: env.SOKNA_VALIDATION_PROFILE == 'full'
        shell: powershell
        run: |
          $expected=$env:SOKNA_EXPECTED_COMMIT.Trim()
          if([string]::IsNullOrWhiteSpace($expected)){ throw 'EXACT_RC_EXPECTED_COMMIT_REQUIRED' }
          $headOut=@(& git rev-parse HEAD)
          if($LASTEXITCODE-ne0){throw 'EXACT_RC_GIT_HEAD_FAILED'}
          $head=(($headOut-join"`n").Trim())
          if(-not [string]::Equals($head,$expected,[StringComparison]::OrdinalIgnoreCase)){ throw "EXACT_RC_CHECKOUT_MISMATCH: expected=$expected actual=$head" }
          if(@(& git status --porcelain --untracked-files=all).Count -gt 0){ throw 'EXACT_RC_DIRTY_CHECKOUT' }
          $rcDir=Join-Path $env:RUNNER_TEMP 'sokna-r1'
          New-Item -ItemType Directory -Path $rcDir -Force | Out-Null
          python tools/release/Build-R1SourceRC.py --commit $head --candidate-ref $env:SOKNA_CANDIDATE_REF --agent-version 2.7.1 --extension-version 3.12.2 --accepted-live-agent-baseline 2.7.1 --output (Join-Path $rcDir 'SOKNA-Agent-2.7.1-source.zip') --manifest-output (Join-Path $rcDir 'source-manifest.json')
          if($LASTEXITCODE -ne 0){ throw 'R1_SOURCE_BUNDLE_BUILD_FAILED' }
          "SOKNA_R1_DIR=$rcDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Windows adversarial preflight
        id: windows_adversarial
        continue-on-error: true
        shell: powershell
        run: ./tools/ci/Test-WindowsAdversarialPreflight.ps1 -RuntimeVersion 2.7.1
      - name: Windows PowerShell/runtime compatibility preflight
        id: windows_compat
        continue-on-error: true
        shell: powershell
        run: ./tools/ci/Test-WindowsAgentEnvironment.ps1 -Profile $env:SOKNA_VALIDATION_PROFILE -RuntimeVersion 2.7.1
      - name: Extension pure contract tests
        id: ext_contracts
        continue-on-error: true
        shell: powershell
        run: |
          node tools/tests/test_agent_job_core.mjs
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          node tools/tests/test_terminal_status_delivery.mjs
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          node tools/tests/test_semantic_runtime_e2e.mjs
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Product UX and browser integration contracts
        id: product_ux
        continue-on-error: true
        shell: powershell
        run: python tools/tests/test_extension_product_ux.py
      - name: Transport 3.10.5 regression tests
        id: transport
        continue-on-error: true
        shell: powershell
        run: node tools/tests/test_transport_v3105.mjs
      - name: Repository contract tests
        id: repo_contracts
        continue-on-error: true
        shell: powershell
        run: python tools/tests/test_autonomy_bootstrap.py
      - name: ArtifactRoot P0-C source contracts
        id: p0_contracts
        continue-on-error: true
        shell: powershell
        run: python tools/tests/test_artifact_root_contract.py
      - name: P1 installer and maintenance source contracts
        id: p1_contracts
        continue-on-error: true
        shell: powershell
        run: python tools/tests/test_p1_installer_contract.py
      - name: P2 workspace and permission source contracts
        id: p2_contracts
        continue-on-error: true
        shell: powershell
        run: python tools/tests/test_p2_workspace_permissions.py
      - name: P3 browser and visual QA source contracts
        id: p3_contracts
        continue-on-error: true
        shell: powershell
        run: python tools/tests/test_p3_browser_visual_qa.py
      - name: P4 artifact provider source contracts
        id: p4_contracts
        continue-on-error: true
        shell: powershell
        run: python tools/tests/test_p4_artifact_providers.py
      - name: P5 advanced workspace source contracts
        id: p5_contracts
        continue-on-error: true
        shell: powershell
        run: python tools/tests/test_p5_advanced_workspaces.py
      - name: P6 component and automation source contracts
        id: p6_contracts
        continue-on-error: true
        shell: powershell
        run: python tools/tests/test_p6_component_automation.py
      - name: Bridge session execution gate contracts
        id: bridge_gate
        continue-on-error: true
        shell: powershell
        run: python tools/tests/test_bridge_session_execution_gate.py
      - name: R0 whole-product source integration contracts
        id: r0_contracts
        continue-on-error: true
        shell: powershell
        run: python tools/tests/test_r0_whole_product.py
      - name: R1 release-candidate freeze contracts
        id: r1_contracts
        continue-on-error: true
        shell: powershell
        run: python tools/tests/test_r1_release_candidate.py
      - name: Native agent workspace/grant tests
        id: native_agent
        continue-on-error: true
        shell: powershell
        run: |
          Push-Location native/agent
          try { go test ./... } finally { Pop-Location }
      - name: Native browser QA tests
        id: native_browser
        continue-on-error: true
        shell: powershell
        run: |
          Push-Location native/browser
          try { go test ./... } finally { Pop-Location }
      - name: Native artifact provider tests
        id: native_provider
        continue-on-error: true
        shell: powershell
        run: |
          Push-Location native/provider
          try { go test ./... } finally { Pop-Location }
      - name: Native host config-locator tests
        id: native_host
        continue-on-error: true
        shell: powershell
        run: |
          Push-Location native/host
          try { go test ./... } finally { Pop-Location }
      - name: ArtifactRoot 2.7.1 Windows negative matrix
        id: win_artifact_root
        continue-on-error: true
        shell: powershell
        run: ./tools/runtime/releases/2.7.1/Test-ArtifactRoot271.ps1
      - name: Workspace 2.7.1 Windows permission matrix
        id: win_workspace
        continue-on-error: true
        shell: powershell
        run: ./tools/runtime/releases/2.7.1/Test-Workspace271.ps1
      - name: Advanced Workspace 2.7.1 Windows acceptance
        id: win_advanced_workspace
        continue-on-error: true
        shell: powershell
        run: ./tools/runtime/releases/2.7.1/Test-AdvancedWorkspace271.ps1
      - name: Artifact Providers 2.7.1 Windows acceptance
        id: win_artifact_provider
        continue-on-error: true
        shell: powershell
        run: ./tools/runtime/releases/2.7.1/Test-ArtifactProviders271.ps1
      - name: Browser QA 2.7.1 Windows acceptance
        id: win_browser
        continue-on-error: true
        if: env.SOKNA_VALIDATION_PROFILE == 'full'
        shell: powershell
        run: ./tools/runtime/releases/2.7.1/Test-BrowserQA271.ps1
      - name: Component lifecycle and automation 2.7.1 Windows acceptance
        id: win_component
        continue-on-error: true
        if: env.SOKNA_VALIDATION_PROFILE == 'full'
        shell: powershell
        run: ./tools/runtime/releases/2.7.1/Test-ComponentAutomation271.ps1
      - name: R2 semantic reliability and round-trip contracts
        id: r2_contracts
        continue-on-error: true
        shell: powershell
        run: |
          python tools/tests/test_r2_contract_reliability.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/tests/test_r2_observability.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/tests/test_r2_outbound_artifacts.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/tests/test_r2_browser_audit.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/tests/test_r2_session_continuity.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/tests/test_browser_credential_contract.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python tools/tests/test_chat_artifact_autopull.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          node tools/tests/test_capability_gate.mjs
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          node tools/tests/test_outbound_attachment_core.mjs
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          node tools/tests/test_chat_artifact_core.mjs
      - name: Environment selector and knowledge helpers
        id: env_helpers
        continue-on-error: true
        shell: powershell
        run: |
          $selection = ./tools/ci/Select-ExecutionEnvironment.ps1 -Traits @('windows-specific','clean-environment-sufficient') | ConvertFrom-Json
          if ($selection.environment -ne 'github_windows_clean') { throw "ENV_SELECTOR_MISMATCH: $($selection.environment)" }
          $route = ./tools/ci/Select-FastWorkRoute.ps1 -Traits @('exact-source-already-in-development-workspace','windows-specific','clean-environment-sufficient') | ConvertFrom-Json
          if ($route.source_route -ne 'existing_exact_development_archive') { throw "FAST_ROUTE_MISMATCH: $($route.source_route)" }
          if ($route.github_push_policy -ne 'meaningful_validated_checkpoint_only') { throw 'FAST_ROUTE_PUSH_POLICY_MISMATCH' }
          $kb = ./tools/knowledge/Query-AgentKnowledge.ps1 -Tags @('windows') -Limit 10 | ConvertFrom-Json
          if ([int]$kb.count -lt 1) { throw 'KB_WINDOWS_QUERY_EMPTY' }
      - name: Windows diagnostic gate
        if: always()
        shell: powershell
        env:
          WINDOWS_ADVERSARIAL: ${{ steps.windows_adversarial.outcome }}
          WINDOWS_COMPAT: ${{ steps.windows_compat.outcome }}
          EXT_CONTRACTS: ${{ steps.ext_contracts.outcome }}
          PRODUCT_UX: ${{ steps.product_ux.outcome }}
          TRANSPORT: ${{ steps.transport.outcome }}
          REPO_CONTRACTS: ${{ steps.repo_contracts.outcome }}
          P0_CONTRACTS: ${{ steps.p0_contracts.outcome }}
          P1_CONTRACTS: ${{ steps.p1_contracts.outcome }}
          P2_CONTRACTS: ${{ steps.p2_contracts.outcome }}
          P3_CONTRACTS: ${{ steps.p3_contracts.outcome }}
          P4_CONTRACTS: ${{ steps.p4_contracts.outcome }}
          P5_CONTRACTS: ${{ steps.p5_contracts.outcome }}
          P6_CONTRACTS: ${{ steps.p6_contracts.outcome }}
          BRIDGE_GATE: ${{ steps.bridge_gate.outcome }}
          R0_CONTRACTS: ${{ steps.r0_contracts.outcome }}
          R1_CONTRACTS: ${{ steps.r1_contracts.outcome }}
          NATIVE_AGENT: ${{ steps.native_agent.outcome }}
          NATIVE_BROWSER: ${{ steps.native_browser.outcome }}
          NATIVE_PROVIDER: ${{ steps.native_provider.outcome }}
          NATIVE_HOST: ${{ steps.native_host.outcome }}
          WIN_ARTIFACT_ROOT: ${{ steps.win_artifact_root.outcome }}
          WIN_WORKSPACE: ${{ steps.win_workspace.outcome }}
          WIN_ADVANCED_WORKSPACE: ${{ steps.win_advanced_workspace.outcome }}
          WIN_ARTIFACT_PROVIDER: ${{ steps.win_artifact_provider.outcome }}
          WIN_BROWSER: ${{ steps.win_browser.outcome }}
          WIN_COMPONENT: ${{ steps.win_component.outcome }}
          R2_CONTRACTS: ${{ steps.r2_contracts.outcome }}
          ENV_HELPERS: ${{ steps.env_helpers.outcome }}
        run: |
          $failed=@()
          $required=@('WINDOWS_ADVERSARIAL','WINDOWS_COMPAT','EXT_CONTRACTS','PRODUCT_UX','TRANSPORT','REPO_CONTRACTS','P0_CONTRACTS','P1_CONTRACTS','P2_CONTRACTS','P3_CONTRACTS','P4_CONTRACTS','P5_CONTRACTS','P6_CONTRACTS','BRIDGE_GATE','R0_CONTRACTS','R1_CONTRACTS','NATIVE_AGENT','NATIVE_BROWSER','NATIVE_PROVIDER','NATIVE_HOST','WIN_ARTIFACT_ROOT','WIN_WORKSPACE','WIN_ADVANCED_WORKSPACE','WIN_ARTIFACT_PROVIDER','R2_CONTRACTS','ENV_HELPERS')
          if($env:SOKNA_VALIDATION_PROFILE-eq'full'){$required+=@('WIN_BROWSER','WIN_COMPONENT')}
          foreach($name in $required){
            $value=[Environment]::GetEnvironmentVariable($name)
            if([string]$value -ne 'success'){$failed+=($name+'='+$value)}
          }
          if(@($failed).Count -gt 0){throw ('WINDOWS_DIAGNOSTIC_FAILURES: '+($failed -join '; '))}
      - name: Setup .NET 8 for P1 full build
        if: env.SOKNA_VALIDATION_PROFILE == 'full'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Acquire pinned Inno Setup compiler for P1 full build
        if: env.SOKNA_VALIDATION_PROFILE == 'full'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .ci/tools -Force | Out-Null
          nuget install Tools.InnoSetup -Version 6.7.3 -OutputDirectory .ci/tools -NonInteractive
          $iscc=Get-ChildItem .ci/tools -Filter ISCC.exe -File -Recurse | Select-Object -First 1
          if(-not $iscc){ throw 'PINNED_INNO_COMPILER_NOT_FOUND' }
          $iscc.FullName | Set-Content .ci/inno-compiler-path.txt -Encoding ASCII
      - name: Build P1 self-contained maintenance, launcher, Control Center and Setup.exe
        if: env.SOKNA_VALIDATION_PROFILE == 'full'
        shell: powershell
        run: |
          $iscc=(Get-Content .ci/inno-compiler-path.txt -Raw).Trim()
          $buildOutput=@(./tools/installer/Build-P1Installer.ps1 -InnoCompiler $iscc -ExpectedSourceCommit $env:SOKNA_EXPECTED_COMMIT)
          $result=($buildOutput | Select-Object -Last 1) | ConvertFrom-Json
          if(-not $result.ok){ throw 'P1_INSTALLER_BUILD_FAILED' }
          $setup=Get-ChildItem artifacts/windows/setup -Filter 'SOKNA-Bridge-Setup-*.exe' -File | Select-Object -First 1
          if(-not $setup){ throw 'P1_SETUP_EXE_MISSING' }
      - name: P1 clean-system install, repair, upgrade, rollback and uninstall acceptance
        if: env.SOKNA_VALIDATION_PROFILE == 'full'
        shell: powershell
        run: |
          $setup=Get-ChildItem artifacts/windows/setup -Filter 'SOKNA-Bridge-Setup-*.exe' -File | Select-Object -First 1
          if(-not $setup){ throw 'P1_SETUP_EXE_MISSING_FOR_ACCEPTANCE' }
          ./tools/installer/Test-P1Windows.ps1 -SetupPath $setup.FullName
      - name: Write exact-RC Windows evidence
        if: env.SOKNA_VALIDATION_PROFILE == 'full'
        shell: powershell
        run: |
          $setup=Get-ChildItem artifacts/windows/setup -Filter 'SOKNA-Bridge-Setup-*.exe' -File | Select-Object -First 1
          if(-not $setup){ throw 'P1_SETUP_EXE_MISSING_FOR_EVIDENCE' }
          ./tools/ci/Write-ExactRCEvidence.ps1 `
            -SourceManifestPath (Join-Path $env:SOKNA_R1_DIR 'source-manifest.json') `
            -SourceBundlePath (Join-Path $env:SOKNA_R1_DIR 'SOKNA-Agent-2.7.1-source.zip') `
            -SetupPath $setup.FullName `
            -PayloadManifestPath 'artifacts/windows/installer-payload/manifests/installed-manifest.json' `
            -AcceptanceStatus passed `
            -OutputPath (Join-Path $env:SOKNA_R1_DIR 'windows-exact-rc-evidence.json')
      - name: Upload exact-RC source, setup and evidence
        if: env.SOKNA_VALIDATION_PROFILE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: SOKNA-Agent-2.7.1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}\sokna-r1\SOKNA-Agent-2.7.1-source.zip
            ${{ runner.temp }}\sokna-r1\source-manifest.json
            ${{ runner.temp }}\sokna-r1\windows-exact-rc-evidence.json
            artifacts/windows/setup/SOKNA-Bridge-Setup-*.exe
            artifacts/windows/installer-payload/manifests/installed-manifest.json
      - name: Windows Agent runtime
        shell: powershell
        run: |
          ./tools/ci/Test-WindowsAgentEnvironment.ps1 -Profile $env:SOKNA_VALIDATION_PROFILE -RuntimeVersion '2.5.7'

  release:
    name: Publish SOKNA Bridge 2.7.1-r2
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/2.7.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-Agent-2.7.1-${{ github.sha }}
          path: release-assets
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f "$(find release-assets -type f -name 'SOKNA-Bridge-Setup-2.7.1-x64.exe' -print -quit)"
          test -f "$(find release-assets -type f -name 'SOKNA-Agent-2.7.1-source.zip' -print -quit)"
          test -f "$(find release-assets -type f -name 'windows-exact-rc-evidence.json' -print -quit)"
          test -f "$(find release-assets -type f -name 'source-manifest.json' -print -quit)"
      - name: Create immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='sokna-agent-2.7.1-r2'
          setup_src=$(find release-assets -type f -name 'SOKNA-Bridge-Setup-2.7.1-x64.exe' -print -quit)
          source_zip_src=$(find release-assets -type f -name 'SOKNA-Agent-2.7.1-source.zip' -print -quit)
          evidence=$(find release-assets -type f -name 'windows-exact-rc-evidence.json' -print -quit)
          source_manifest=$(find release-assets -type f -name 'source-manifest.json' -print -quit)
          setup="$RUNNER_TEMP/SOKNA-Bridge-Setup-2.7.1-r2-x64.exe"
          source_zip="$RUNNER_TEMP/SOKNA-Agent-2.7.1-r2-source.zip"
          cp "$setup_src" "$setup"
          cp "$source_zip_src" "$source_zip"
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::RELEASE_TAG_COMMIT_MISMATCH expected=$GITHUB_SHA actual=$existing"
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$setup" "$source_zip" "$evidence" "$source_manifest" --clobber
            else
              gh release create "$tag" "$setup" "$source_zip" "$evidence" "$source_manifest" --verify-tag --title 'SOKNA Bridge 2.7.1-r2' --notes-file docs/releases/2.7.1-r2.md
            fi
          else
            gh release create "$tag" "$setup" "$source_zip" "$evidence" "$source_manifest" --target "$GITHUB_SHA" --title 'SOKNA Bridge 2.7.1-r2' --notes-file docs/releases/2.7.1-r2.md
          fi
